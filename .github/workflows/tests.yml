name: Tests
on: [push]

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
          - windows-2019
        node_version:
          - "20"
          - "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install packages
        run: npm install
      - name: Tests on ${{ matrix.os }} with Node ${{ matrix.node_version }}
        run: npm run test
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install packages
        run: npm install
      - name: Run eslint
        run: npm run lint:js
      - name: Run lint:ts
        run: npm run lint:ts
      - name: Run coverage
        run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install and configure poetry
        run: |
          python -m pip install poetry
          python -m poetry config virtualenvs.create false
      - name: Install python packages
        run: python -m poetry install
      - name: Run python linters
        run: |
          python -m poetry run black --check run-ci.py
          python -m poetry run flake8 run-ci.py
          python -m poetry run isort --check --profile black run-ci.py
          python -m poetry run mypy run-ci.py
